services:
  - type: web
    name: portafolio-backend
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGINS
        value: https://www.yoryopkrk.cl,https://yoryopkrk.cl
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SSL
        value: true
      - key: POSTGRES_SCHEMA
        value: contacto_bd
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_TO
        sync: false
      - key: ADMIN_API_KEY
        sync: false
